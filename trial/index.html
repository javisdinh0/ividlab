<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dùng thử miễn phí 90 ngày — A-Soft License</title>
  <meta name="description" content="Nhập Product Key để nhận ngay license dùng thử 90 ngày cho các plugin A-Soft.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('ividlab-theme'); } catch (e) {}
      if (!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <main class="center-view">
    <div class="auth-card">
      <div class="brand-mark">🔑</div>
      <h1>Dùng thử miễn phí 90 ngày</h1>
      <p class="sub">Dán Product Key từ hộp thoại "License" của plugin, nhập email, nhận key ngay.</p>

      <form id="trial-form" class="auth-form">
        <div class="field">
          <label>Product Key</label>
          <textarea id="product-key" rows="2" placeholder="Dán Product Key từ hộp thoại License của plugin" required></textarea>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field" id="product-override-field">
          <label>Sản phẩm (chỉ cần khi Product Key không tự nhận diện được)</label>
          <select id="product-override">
            <option value="">(tự nhận diện)</option>
            <option value="DrawSteels">DrawSteels</option>
            <option value="PurlinShopdrawing">PurlinShopdrawing</option>
            <option value="SDU">SDU</option>
            <option value="CADToon">CADToon</option>
            <option value="PEBToolsVN">PEBToolsVN</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Nhận key dùng thử</button>
        <p class="form-err" id="form-err"></p>
      </form>

      <div id="result" class="result-box" style="display:none;">
        <p class="sub" style="margin-bottom:0.6rem;">Đã tạo Active Key dùng thử 90 ngày cho <strong id="result-product"></strong>:</p>
        <textarea id="result-key" rows="6" readonly></textarea>
        <button class="btn btn-ghost btn-block" id="copy-btn" type="button">Copy Active Key</button>
        <p class="muted" style="margin-top:1rem;">Dán key này vào hộp thoại "License" của plugin, bấm Activate. Cần license đầy đủ sau khi hết hạn dùng thử? Liên hệ qua Zalo/email trên trang chủ.</p>
      </div>
    </div>
  </main>

  <script type="module" src="trial.js"></script>
</body>
</html>
