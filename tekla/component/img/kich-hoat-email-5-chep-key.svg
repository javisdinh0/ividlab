<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Copy the Active Key</title>
  <style>
    /* Concept: generic received-email view, same flat style as the dialog steps */
    :root {
      --text: #2B4E64;
      --accent: #2E6583;
      --border: #D3E2E7;
      --panel: #F1F6F8;
      --input: #FFFFFF;
      --highlight: #E8772E;
      --muted: #4F7C91;
      --font-sans: "Segoe UI", Tahoma, Arial, sans-serif;
      --font-mono: "Consolas", "Courier New", monospace;
    }
    text { font-family: var(--font-sans); }
    .mono { font-family: var(--font-mono); }
    .canvas-bg { fill: var(--panel); }
    .mail-win { fill: var(--input); stroke: var(--border); stroke-width: 1.5; }
    .header-bar { fill: var(--accent); }
    .header-text { fill: var(--input); font-weight: bold; font-size: 14px; }
    .win-ctrl { stroke: var(--input); stroke-width: 1.5; fill: none; stroke-linecap: round; }
    .field-tag { fill: var(--muted); font-size: 13px; }
    .field-val { fill: var(--text); font-size: 13.5px; font-weight: 600; }
    .divider { stroke: var(--border); stroke-width: 1; }
    .body-text { fill: var(--text); font-size: 14px; font-weight: 600; }
    .code-box { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .code-text { fill: var(--text); font-size: 13px; }
    .chip { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .chip-text { fill: var(--text); font-size: 13px; }
    .clip { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; }
    .hl-frame { fill: none; stroke: var(--highlight); stroke-width: 2.5; }
    .hl-line { stroke: var(--highlight); stroke-width: 2; }
    .hl-badge { fill: var(--highlight); }
    .hl-num { fill: var(--input); font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="760" height="470" class="canvas-bg" />

  <!-- Mail window -->
  <rect x="40" y="20" width="680" height="430" rx="6" class="mail-win" />
  <path d="M 40 26 A 6 6 0 0 1 46 20 L 714 20 A 6 6 0 0 1 720 26 L 720 54 L 40 54 Z" class="header-bar" />
  <text x="55" y="41" class="header-text">Inbox</text>
  <line x1="645" y1="39" x2="655" y2="39" class="win-ctrl" />
  <rect x="665" y="31" width="10" height="10" class="win-ctrl" />
  <line x1="685" y1="31" x2="695" y2="41" class="win-ctrl" />
  <line x1="695" y1="31" x2="685" y2="41" class="win-ctrl" />

  <!-- Headers -->
  <text x="60" y="80" class="field-tag">From</text>
  <text x="110" y="80" class="field-val">iViDLab &lt;ividlab.com@gmail.com&gt;</text>
  <text x="60" y="106" class="field-tag">Subject</text>
  <text x="125" y="106" class="field-val">Re: Shear (CC1) trial SH1</text>
  <line x1="40" y1="122" x2="720" y2="122" class="divider" />

  <!-- Body -->
  <text x="60" y="154" class="body-text">Active Key — Shear (CC1), 15 ngày / 15 days</text>

  <rect x="60" y="172" width="600" height="118" rx="4" class="code-box" />
  <text x="74" y="198" class="code-text mono">HardwareId=4F2A9C1E…B70D9E21</text>
  <text x="74" y="218" class="code-text mono">UserName=you@example.com</text>
  <text x="74" y="238" class="code-text mono">IssuedDate=2026-11-13</text>
  <text x="74" y="258" class="code-text mono">ExpiryDate=2026-11-28</text>
  <text x="74" y="278" class="code-text mono">Signature=ZE5yts98N0na3fB4…pSW0DfgAA==</text>

  <!-- Highlight 5: the key block -->
  <rect x="56" y="168" width="608" height="126" rx="4" class="hl-frame" />
  <line x1="664" y1="231" x2="694" y2="231" class="hl-line" />
  <circle cx="708" cy="231" r="14" class="hl-badge" />
  <text x="708" y="231" class="hl-num">5</text>

  <!-- Attachment -->
  <line x1="40" y1="330" x2="720" y2="330" class="divider" />
  <rect x="60" y="348" width="200" height="38" rx="19" class="chip" />
  <path d="M 84 360 L 84 374 A 5 5 0 0 0 94 374 L 94 358 A 3.5 3.5 0 0 0 87 358 L 87 372" class="clip" />
  <text x="104" y="372" class="chip-text">ActiveKey-SH1.txt</text>
</svg>
